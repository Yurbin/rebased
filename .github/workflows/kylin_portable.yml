name: Kylin Portable Build

on:
  push:
    branches:
      - 'kylin/**'
    tags:
      - 'kylin-v*'
  workflow_dispatch:

permissions: {}

env:
  REBASED_VERSION: '1.1.23'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/free_disk_space_and_expand_swap
      - name: Run compareWithRef unit tests
        run: ./tests.cmd --module intellij.vcs.git.backend.tests --test 'git4idea.actions.compareWithRef.*Test'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/free_disk_space_and_expand_swap
      - name: Build Docker image
        run: docker build . --target intellij_idea --tag intellij_idea
      - name: Build Rebased Linux x64 distribution
        run: >-
          docker run --rm --user "$(id -u)" --volume "$PWD:/community" intellij_idea
          -Dbuild.version=$REBASED_VERSION
          -Dintellij.build.target.os=linux
          -Dintellij.build.target.arch=x64
      - name: Assemble Kylin portable package
        run: >-
          bash .github/kylin/package-kylin-portable.sh
          --input out/idea-ce/artifacts/rebased.tar.gz
          --version "$REBASED_VERSION"
          --suffix "kylin.${{ github.run_number }}"
          --out out/kylin
      - name: Upload Kylin portable artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rebased-kylin-portable
          if-no-files-found: 'error'
          retention-days: 14
          path: |
            out/kylin/*.tar.gz
            out/kylin/*.sha256

  release:
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - build
    if: startsWith(github.ref, 'refs/tags/kylin-v')
    permissions:
      contents: write
    steps:
      - name: Download Kylin portable artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: rebased-kylin-portable
          path: dist
      - name: Create GitHub Prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG_NAME" \
            --prerelease \
            --notes "Kylin V10 SP1 (x86_64) offline portable package." \
            dist/*.tar.gz dist/*.sha256
